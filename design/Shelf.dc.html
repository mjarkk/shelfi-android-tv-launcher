<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stacks home</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
button{font:inherit;color:inherit;border:0;padding:0;cursor:pointer}
.spine{writing-mode:vertical-rl;transform:rotate(180deg);display:flex;align-items:center;justify-content:space-between;padding:24px 0;box-sizing:border-box;font-weight:600;font-size:22px;letter-spacing:0.02em}
</style>
</helmet>
<div style="width: 1920px; height: 1080px; position: relative; overflow: hidden; background: #13241D; color: #F3EEE3; font-family: 'Space Grotesk', sans-serif">

  <header style="position: absolute; left: 120px; right: 120px; top: 60px; display: flex; align-items: center; gap: 56px">
    <span style="font-size: 30px; font-weight: 700; letter-spacing: -0.01em">stacks</span>
    <nav aria-label="Shelves" style="display: flex; gap: 12px; font-size: 20px; font-weight: 500">
      <a href="#" style="text-decoration: none; color: #13241D; background: #F3EEE3; padding: 10px 22px; border-radius: 999px">All games</a>
      <a href="#" style="text-decoration: none; color: #C9D3C8; padding: 10px 22px; border-radius: 999px">Playing now</a>
      <a href="#" style="text-decoration: none; color: #C9D3C8; padding: 10px 22px; border-radius: 999px">Finished</a>
      <a href="#" style="text-decoration: none; color: #C9D3C8; padding: 10px 22px; border-radius: 999px">Wishlist</a>
      <a href="#" style="text-decoration: none; color: #C9D3C8; padding: 10px 22px; border-radius: 999px">Store</a>
    </nav>
    <span style="margin-left: auto; font-size: 20px; color: #C9D3C8">Mara · 21:47</span>
  </header>

  <section aria-label="Shelf" style="position: absolute; left: 120px; right: 120px; top: 200px; height: 620px; display: flex; align-items: flex-end; gap: 8px">
    <button class="spine" aria-label="Quiet Harbour" style="width: 78px; height: 500px; background: #D9C9A3; color: #3A2E1A"><span>Quiet Harbour</span><span aria-hidden="true" style="width: 22px; height: 22px; border-radius: 50%; background: #3A2E1A"></span></button>
    <button class="spine" aria-label="Iron Saints" style="width: 92px; height: 540px; background: #8A2C2C; color: #F3EEE3"><span>IRON SAINTS</span><span aria-hidden="true" style="width: 26px; height: 6px; background: #F3EEE3"></span></button>
    <button class="spine" aria-label="Bloom" style="width: 70px; height: 470px; background: #F1A7B8; color: #4A1828"><span>bloom</span><span aria-hidden="true" style="width: 20px; height: 20px; border-radius: 50% 0; background: #4A1828"></span></button>
    <button class="spine" aria-label="Cartographer" style="width: 84px; height: 520px; background: #2F4B6E; color: #F3EEE3"><span>Cartographer</span><span aria-hidden="true" style="width: 22px; height: 22px; border: 3px solid #F3EEE3; box-sizing: border-box"></span></button>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 0; margin: 0 28px; transform: translateY(-36px)">
      <button aria-label="Fern and the Deep Wood, focused" style="width: 400px; height: 560px; background: #E3B23C; position: relative; overflow: hidden; border-radius: 6px; outline: 5px solid #F3EEE3; outline-offset: 8px; box-shadow: 0 40px 60px -20px rgba(0,0,0,0.6)">
        <span aria-hidden="true" style="position: absolute; left: 0; bottom: 0; width: 100%; height: 260px; background: #2E5E3E"></span>
        <span aria-hidden="true" style="position: absolute; left: 40px; bottom: 140px; width: 0; height: 0; border-left: 70px solid transparent; border-right: 70px solid transparent; border-bottom: 220px solid #1E4430"></span>
        <span aria-hidden="true" style="position: absolute; left: 200px; bottom: 160px; width: 0; height: 0; border-left: 90px solid transparent; border-right: 90px solid transparent; border-bottom: 280px solid #183A28"></span>
        <span aria-hidden="true" style="position: absolute; left: 260px; top: 60px; width: 90px; height: 90px; border-radius: 50%; background: #F7E7B4"></span>
        <span aria-hidden="true" style="position: absolute; left: 180px; bottom: 60px; width: 40px; height: 70px; border-radius: 20px 20px 4px 4px; background: #E3B23C"></span>
        <span style="position: absolute; left: 32px; top: 36px; right: 140px; text-align: left; font-size: 40px; line-height: 1; font-weight: 700; color: #1E2A20">Fern and the Deep Wood</span>
      </button>
    </div>

    <button class="spine" aria-label="Lowlight" style="width: 74px; height: 490px; background: #2A2A2E; color: #F3EEE3"><span>LOWLIGHT</span><span aria-hidden="true" style="width: 22px; height: 22px; border-radius: 50%; border: 3px solid #F3EEE3; box-sizing: border-box"></span></button>
    <button class="spine" aria-label="Tin Orchestra" style="width: 88px; height: 530px; background: #5F7F79; color: #F3EEE3"><span>Tin Orchestra</span><span aria-hidden="true" style="width: 24px; height: 24px; background: #F3EEE3; clip-path: polygon(50% 0, 100% 100%, 0 100%)"></span></button>
    <button class="spine" aria-label="Pocket Kingdoms" style="width: 80px; height: 480px; background: #F3EEE3; color: #13241D"><span>Pocket Kingdoms</span><span aria-hidden="true" style="width: 22px; height: 22px; background: #8A2C2C"></span></button>
    <button class="spine" aria-label="Velvet Static" style="width: 96px; height: 550px; background: #5A3A7A; color: #F3EEE3"><span>VELVET STATIC</span><span aria-hidden="true" style="width: 26px; height: 6px; background: #F1A7B8"></span></button>
    <button class="spine" aria-label="Sundial" style="width: 70px; height: 460px; background: #C8693B; color: #FFFFFF"><span>Sundial</span><span aria-hidden="true" style="width: 22px; height: 22px; border-radius: 50%; background: #FFFFFF"></span></button>
    <button class="spine" aria-label="Brick by Brick" style="width: 82px; height: 510px; background: #3F6E4E; color: #F3EEE3"><span>Brick by Brick</span><span aria-hidden="true" style="width: 22px; height: 14px; background: #F3EEE3"></span></button>
    <button class="spine" aria-label="Moth Lantern" style="width: 76px; height: 500px; background: #1F3A4A; color: #F7E7B4"><span>Moth Lantern</span><span aria-hidden="true" style="width: 20px; height: 20px; border-radius: 50%; background: #F7E7B4"></span></button>
    <button class="spine" aria-label="Grand Prix Deluxe" style="width: 90px; height: 535px; background: #E3E0D6; color: #8A2C2C"><span>GRAND PRIX DELUXE</span><span aria-hidden="true" style="width: 26px; height: 6px; background: #8A2C2C"></span></button>
    <button class="spine" aria-label="Kite Season" style="width: 72px; height: 470px; background: #7FB7C9; color: #13241D"><span>Kite Season</span><span aria-hidden="true" style="width: 20px; height: 20px; background: #13241D; transform: rotate(45deg)"></span></button>
  </section>

  <div aria-hidden="true" style="position: absolute; left: 80px; right: 80px; top: 820px; height: 28px; background: #6B4A2E; border-radius: 4px"></div>
  <div aria-hidden="true" style="position: absolute; left: 100px; right: 100px; top: 848px; height: 14px; background: #4A3220"></div>

  <section style="position: absolute; left: 120px; top: 900px; display: flex; flex-direction: column; gap: 8px">
    <span style="font-size: 34px; font-weight: 700">Fern and the Deep Wood</span>
    <span style="font-size: 20px; color: #C9D3C8">Exploration · 9 of 12 seeds found · Last played yesterday</span>
  </section>

  <footer style="position: absolute; right: 120px; bottom: 76px; display: flex; gap: 32px; font-size: 19px; font-weight: 500; color: #E2E6DD">
    <span style="display: flex; align-items: center; gap: 10px"><span aria-hidden="true" style="width: 34px; height: 34px; border-radius: 50%; background: #F3EEE3; color: #13241D; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px">A</span>Take off shelf</span>
    <span style="display: flex; align-items: center; gap: 10px"><span aria-hidden="true" style="width: 34px; height: 34px; border-radius: 50%; border: 2px solid #E2E6DD; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px">X</span>Sort shelf</span>
    <span style="display: flex; align-items: center; gap: 10px"><span aria-hidden="true" style="height: 34px; padding: 0 12px; border-radius: 8px; border: 2px solid #E2E6DD; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px">LB RB</span>Change shelf</span>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
